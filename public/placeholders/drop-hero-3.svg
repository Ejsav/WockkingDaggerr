      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="rdrop-hero-3" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c8102e" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c8102e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#gdrop-hero-3)"/>
  <rect width="1920" height="1080" fill="url(#rdrop-hero-3)"/>

