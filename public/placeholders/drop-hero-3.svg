  <line x1="0" y1="950" x2="1920" y2="-150" stroke="#f5f1ea" stroke-width="1" opacity="0.05"/>

  <!-- Label -->
  <text x="960" y="900" fill="#f5f1ea" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="120" text-anchor="middle" letter-spacing="3">DROP 01 — ORIGIN</text>
