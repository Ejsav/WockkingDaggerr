      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <radialGradient id="rproduct-6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8102e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c8102e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#gproduct-6)"/>
  <rect width="800" height="1000" fill="url(#rproduct-6)"/>

  <!-- Big blade silhouette -->
