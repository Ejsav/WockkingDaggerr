    <line x1="760" y1="40" x2="720" y2="40"/>
    <line x1="760" y1="40" x2="760" y2="80"/>
    <line x1="40" y1="960" x2="80" y2="960"/>
    <line x1="40" y1="960" x2="40" y2="920"/>
    <line x1="760" y1="960" x2="720" y2="960"/>
    <line x1="760" y1="960" x2="760" y2="920"/>
  </g>

  <!-- Label -->
  <text x="400" y="820" fill="#f5f1ea" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="62" text-anchor="middle" letter-spacing="2">ZINE 01</text>
  <text x="400" y="860" fill="#c8102e" font-family="Courier New, monospace" font-size="13" text-anchor="middle" letter-spacing="6">━━ EDITION ━━</text>
